name: Build and release JARs

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check release tag matches POM version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(mvn --quiet --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          test "$RELEASE_TAG" = "v$version" || { echo "Tag $RELEASE_TAG does not match POM version $version"; exit 1; }
      - name: Test and package library, dependencies, sources and Javadoc
        run: mvn --batch-mode --no-transfer-progress -P release clean package
      - name: Prepare downloads and checksums
        run: |
          mkdir -p dist
          cp target/*.jar dist/
          cd dist
          sha256sum *.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zkteco-jars
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zkteco-jars
          path: dist
      - name: Publish GitHub release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' \
            'Java 8 compatible library. Download the regular JAR for managed dependencies, or the all JAR with dependencies included.' \
            'These are library JARs, not standalone applications. Source JAR, French API Javadoc JAR and SHA-256 checksums are included.' \
            'Bulk reading is available through getAllUserWithFingerprints(): one profile list request, then up to ten fingerprint reads per user, with per-finger database errors retained in each snapshot.' \
            'Fingerprint import is covered by simulated UDP tests; recognition and firmware compatibility require device validation.' > release-notes.md
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "ZKTeco Java library $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
          fi

  central:
    if: startsWith(github.ref, 'refs/tags/v') && vars.MAVEN_CENTRAL_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publishing secrets are configured
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Use Maven 3.9.16 for Central staging compatibility
        run: |
          url=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          curl --fail --silent --show-error --location "$url" -o "$RUNNER_TEMP/maven.tar.gz"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Sign and publish library, sources, Javadoc and POM
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -P release,central clean deploy
      - name: Verify Maven Central dependency resolution in an independent project
        run: |
          version=$(mvn --quiet --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          mkdir -p "$RUNNER_TEMP/central-consumer"
          cat > "$RUNNER_TEMP/central-consumer/pom.xml" <<EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>example</groupId><artifactId>central-consumer</artifactId><version>1</version>
            <dependencies><dependency>
              <groupId>io.github.kenny516</groupId><artifactId>zkteco-biometric-lib</artifactId><version>$version</version>
            </dependency></dependencies>
          </project>
          EOF
          # Use a fresh repository so the publisher's local install cannot satisfy this check.
          # Allow time for the published files to propagate to the public Maven repository.
          for attempt in {1..20}; do
            if mvn --batch-mode --no-transfer-progress -U \
              -f "$RUNNER_TEMP/central-consumer/pom.xml" \
              -Dmaven.repo.local="$RUNNER_TEMP/central-consumer-repository" \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:resolve; then
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then sleep 30; fi
          done
          echo "Public Maven Central resolution failed; check the published deployment before retrying."
          exit 1
